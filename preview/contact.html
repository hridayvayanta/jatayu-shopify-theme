<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Concierge | JATAYU (जटायु)</title>
    <link rel="icon" type="image/jpeg" href="/assets/jatayu-logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/theme.css">
  </head>
  <body>
    <header class="site-header scrolled">
      <div class="header-container">
        <nav class="header-nav-left">
          <a href="/collections" class="nav-link">Shop</a>
          <a href="/collections" class="nav-link">Collections</a>
          <a href="/pages/our-story" class="nav-link">Our Story</a>
        </nav>
        <div class="header-logo-center">
          <a href="/"><img src="/assets/jatayu-logo-transparent.png" onerror="this.onerror=null; this.src='/assets/jatayu-logo.jpg';" alt="JATAYU" class="header-logo-img" width="160" height="52"></a>
        </div>
        <div class="header-actions-right">
          <a href="/cart" class="header-action-btn" data-cart-open>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
            <span class="header-cart-count" style="display: none;">0</span>
          </a>
        </div>
      </div>
    </header>

    <main id="MainContent" role="main" style="padding: 140px 0 100px;">
      <div class="page-width">
        <div style="max-width: 680px; margin: 0 auto;">
          <div style="text-align: center; margin-bottom: 48px;">
            <span class="label-eyebrow">CONCIERGE & INQUIRIES</span>
            <h1 class="heading-section" style="color: var(--color-maroon-primary); margin-bottom: 16px;">Get in Touch</h1>
            <p style="color: rgba(33, 27, 25, 0.8);">We welcome inquiries regarding orders, sizing, bespoke requests, and collaborations.</p>
          </div>

          <form onsubmit="event.preventDefault(); alert('Inquiry submitted. Our concierge will be in touch shortly.');" class="contact-form">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
              <div>
                <label style="display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 8px;">Name</label>
                <input type="text" style="width: 100%; padding: 14px 16px; background: var(--color-offwhite); border: 1px solid var(--color-border-subtle); outline: none; font-family: inherit;" required>
              </div>
              <div>
                <label style="display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 8px;">Email</label>
                <input type="email" style="width: 100%; padding: 14px 16px; background: var(--color-offwhite); border: 1px solid var(--color-border-subtle); outline: none; font-family: inherit;" required>
              </div>
            </div>

            <div style="margin-bottom: 20px;">
              <label style="display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 8px;">Phone (Optional)</label>
              <input type="tel" style="width: 100%; padding: 14px 16px; background: var(--color-offwhite); border: 1px solid var(--color-border-subtle); outline: none; font-family: inherit;">
            </div>

            <div style="margin-bottom: 24px;">
              <label style="display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-bottom: 8px;">Message</label>
              <textarea rows="5" style="width: 100%; padding: 14px 16px; background: var(--color-offwhite); border: 1px solid var(--color-border-subtle); outline: none; font-family: inherit;" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Send Inquiry</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="page-width">
        <div class="footer-bottom" style="border: none; padding-top: 0;">
          <div>&copy; 2026 JATAYU (जटायु). All rights reserved.</div>
        </div>
      </div>
    </footer>

    <!-- Cart Drawer -->
    <div class="cart-drawer-overlay" id="cart-drawer-overlay" aria-hidden="true"></div>
    <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true">
      <div class="cart-drawer-header">
        <h3 class="cart-drawer-title">Shopping Bag</h3>
        <button type="button" class="cart-drawer-close" data-cart-close><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <div class="cart-drawer-items" id="cart-drawer-items"></div>
      <div class="cart-drawer-footer">
        <div class="cart-subtotal-row"><span>Subtotal</span><span class="cart-subtotal-price" id="cart-drawer-subtotal">₹0</span></div>
        <a href="/checkout" class="btn btn-primary cart-checkout-btn">Proceed to Checkout</a>
      </div>
    </aside>

    <script src="/assets/theme.js"></script>
  </body>
</html>
